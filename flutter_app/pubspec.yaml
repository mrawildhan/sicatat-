name: sicatat_flutter
description: SICATAT field temperature checklist for CPP Asam-Asam.
publish_to: 'none'
version: 2.6.5+10265

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  supabase_flutter: ^2.8.0
  sqflite: ^2.3.3+1
  sqflite_common_ffi_web: ^1.1.2
  path: ^1.9.0
  connectivity_plus: ^6.1.0
  uuid: ^4.5.1
  intl: ^0.19.0
  pdf: ^3.11.1
  printing: ^5.13.4
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  file_picker: ^10.3.10
  http: ^1.2.2
  package_info_plus: ^8.0.2
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sql/local_schema.sql

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/logo-icon.png
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/images/logo-icon.png
    background_color: "#F2F8F4"
    theme_color: "#0B3D2E"
