name: sicatat_flutter
description: SICATAT field temperature checklist for CPP Asam-Asam.
publish_to: 'none'
version: 2.8.44+12324

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  supabase_flutter: ^2.8.0
  sqflite: ^2.3.3+1
  sqflite_common_ffi_web: ^1.1.2
  path: ^1.9.0
  connectivity_plus: ^6.1.0
  uuid: ^4.5.1
  intl: ^0.20.2
  pdf: ^3.11.1
  printing: ^5.13.4
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  web: ^1.1.1
  file_picker: ^10.3.10
  http: ^1.2.2
  package_info_plus: ^8.0.2
  path_provider: ^2.1.4
  archive: ^4.0.9
  image: ^4.9.2
  fl_chart: ^1.2.0
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.4.2
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  # One typeface for the app and every PDF: Roboto 3.016 (SIL OFL 1.1, the
  # Android system font, owner's choice), cut down to Latin and common symbols
  # to keep the web download small. Roboto has no SemiBold, so w600 renders
  # Bold; Bold is the heaviest file on purpose, so w800/w900 titles stay Bold.
  # See lib/core/pdf/pdf_theme.dart.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
  assets:
    - assets/fonts/
    - assets/images/
    - assets/forms/
    - assets/documents/cost_code_user_guide_2014_r01.pdf
    - assets/sql/local_schema.sql

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/logo-icon.png
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/images/logo-icon.png
    background_color: "#F2F8F4"
    theme_color: "#0B3D2E"
